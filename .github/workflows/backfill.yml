name: Backfill history (manual)

# Run this AFTER you have installed your analytics snippet. It replays
# sessions with the browser clock set to random moments in the past N days
# (Playwright clock API). Whether your analytics tool honors client-side
# timestamps is up to the tool; try a small run first.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Spread sessions over the last N days'
        default: '30'
      sessions_per_shard:
        description: 'Sessions per shard (4 shards run in parallel)'
        default: '100'
      base_url:
        description: 'Site URL (blank = GitHub Pages URL)'
        required: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run backfill sessions
        env:
          SESSIONS: ${{ inputs.sessions_per_shard }}
          BACKFILL_DAYS: ${{ inputs.days }}
          BASE_URL: ${{ inputs.base_url }}
          CONCURRENCY: 4
        run: |
          if [ -z "$BASE_URL" ]; then unset BASE_URL; fi
          node sim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-shard-${{ matrix.shard }}
          path: out/
          retention-days: 14
